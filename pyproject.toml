[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deblang"
version = "1.0.0"
description = "My Own Flavour of Python, powered by DebVM"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Debrup Ghosh"}]

[project.scripts]
deblang = "deblang.cli:main"

[tool.setuptools.packages.find]
include = ["deblang*"]
